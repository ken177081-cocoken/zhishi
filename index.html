<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>直式小達人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: 暖色黏土冒險風——奶油色面板、咖啡色粗邊框、柔和立體按鈕、浮島插圖；單欄，題目板在上、按鍵在下 */
:root{
  --paper:#EFE1C8; --grid:#E2CFAF; --card:#FFF8EC; --ink:#4A3426; --muted:#8A715C;
  --pencil:#F2C14E; --pencil-soft:#FBEBC2; --tint:#F5EAD6; --wood:#C99A6B;
  --red:#D2623F; --good:#6E9F67; --good-soft:#E4EED8; --bad-soft:#F8DED4; --blue:#4F8BA8;
  --scrim:rgba(74,52,38,.55);
  --edge:#9A6A45; --edge-deep:#7A5236; --btn-deep:#D9BF97; --cream2:#F6E6C9; --sage:#86A97F; --hi:rgba(255,255,255,.8);
  --banner:rgba(84,58,40,.9); --banner-ink:#FFF4DF; --glow:#FFF8EA; --bokeh:rgba(255,255,255,.55); --on-gold:#3E2A1E; --lock:#E4CDAA;
  --rainbow:linear-gradient(90deg,#F7A8C8,#F2C230,#7CC66B,#8FD3F4,#B9A6F2);
  --num:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --zh:'Huninn','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
  --kai:'LXGW WenKai TC','BiauKai','DFKai-SB','Kaiti TC',serif;
  --c:clamp(46px,14vw,74px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#2B211B; --grid:#4A3A2E; --card:#3A2D24; --ink:#F6E8D3; --muted:#C2A98F;
  --pencil:#E8B84A; --pencil-soft:#5A4426; --tint:#46372B; --wood:#A97E55;
  --red:#E58466; --good:#8CC183; --good-soft:#33452D; --bad-soft:#4A2E26; --blue:#86B9D2; --scrim:rgba(10,6,4,.72);
  --edge:#B98A5E; --edge-deep:#160F0B; --btn-deep:#1E1510; --cream2:#33271F; --sage:#6F9469; --hi:rgba(255,255,255,.07);
  --banner:rgba(20,14,10,.88); --banner-ink:#FFF0D8; --glow:#4A3628; --bokeh:rgba(255,226,180,.07); --on-gold:#3E2A1E; --lock:#40332A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#2B211B; --grid:#4A3A2E; --card:#3A2D24; --ink:#F6E8D3; --muted:#C2A98F;
  --pencil:#E8B84A; --pencil-soft:#5A4426; --tint:#46372B; --wood:#A97E55;
  --red:#E58466; --good:#8CC183; --good-soft:#33452D; --bad-soft:#4A2E26; --blue:#86B9D2; --scrim:rgba(10,6,4,.72);
  --edge:#B98A5E; --edge-deep:#160F0B; --btn-deep:#1E1510; --cream2:#33271F; --sage:#6F9469; --hi:rgba(255,255,255,.07);
  --banner:rgba(20,14,10,.88); --banner-ink:#FFF0D8; --glow:#4A3628; --bokeh:rgba(255,226,180,.07); --on-gold:#3E2A1E; --lock:#40332A; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--zh);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;padding-inline:16px;padding-block:0 40px}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto}
.star{width:1em;height:1em;fill:var(--pencil);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round;vertical-align:-.12em}
.star.off{fill:transparent;stroke:var(--muted);opacity:.55}
.tag{font-size:13px;letter-spacing:.06em;color:var(--muted)}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:18px 10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.brand svg{width:34px;height:34px}
.hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--num);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.ghost{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:15px}
.ghost.gold{background:var(--pencil);color:var(--on-gold);font-weight:700}

/* Home */
.hero{display:flex;gap:18px;align-items:center;padding-block:14px 18px;flex-wrap:wrap}
.hero h1{font-size:clamp(30px,8vw,44px);line-height:1.15;margin:0;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--muted);max-width:30em}
.hero-txt{flex:1 1 260px;min-width:0}
.mini{font-family:var(--num);font-weight:800;font-size:30px;line-height:1.05;text-align:right;background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 16px;transform:rotate(3deg);font-variant-numeric:tabular-nums}
.mini .c{color:var(--red);font-size:16px;display:block;margin-bottom:-4px;padding-right:22px}
.mini .ln{border-top:3px solid var(--ink);margin-top:4px;padding-top:2px;color:var(--good)}
.bank{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%;text-align:left;background:var(--pencil-soft);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 16px;margin-bottom:18px}
.bank:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.bank-n{font-family:var(--num);font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.bank-r{flex:1 1 200px;min-width:0}
.go{font-weight:700;color:var(--blue)}
.title-chip{display:inline-block;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:14px;font-weight:700;margin:2px 4px 2px 0}
.meter{height:12px;border-radius:999px;background:var(--card);border:2px solid var(--ink);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--pencil);border-right:2px solid var(--ink);transition:width 1.2s cubic-bezier(.3,1.2,.5,1)}
.meter.big{height:18px}
.meter.rainbow i{background:var(--rainbow)}
.jar{width:64px;height:64px;flex:0 0 auto}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lv{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px 16px;transition:transform .12s}
.lv:hover:not(:disabled){transform:translateY(-2px)}
.lv:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.lv:disabled{cursor:not-allowed;opacity:.5;box-shadow:0 5px 0 var(--muted);border-color:var(--muted)}
.lv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lv-name{font-size:21px;font-weight:700}
.lv-desc{color:var(--muted);font-size:15px}
.lv-ex{font-family:var(--num);font-weight:600;font-size:18px;color:var(--blue)}
.mult{font-family:var(--num);font-weight:800;font-size:15px;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--tint)}
.mult.m15{background:var(--good-soft)}.mult.m2{background:var(--pencil-soft)}.mult.m4{background:var(--rainbow);color:var(--on-gold)}
.lv-stars{font-size:20px;display:flex;gap:2px}
.parent{margin-top:26px;padding-top:14px;border-top:2px dashed var(--grid);display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:15px}
.parent label{display:flex;gap:6px;align-items:center;cursor:pointer}
.parent input{width:18px;height:18px;accent-color:var(--blue)}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0}

/* Play */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:4px 12px}
.bar h2{font-size:20px;margin:0;flex:1 1 auto}
.dots{display:flex;gap:6px}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:13px;color:var(--muted)}
.dot.now{border-color:var(--ink);color:var(--ink);background:var(--pencil-soft)}
.dot.ok{border-color:var(--ink);background:var(--pencil);color:var(--on-gold)}
.dot.ok2{border-color:var(--ink);background:var(--good-soft);color:var(--ink)}
.dot.luck:not(.ok):not(.ok2){border-style:dashed;border-color:var(--red);color:var(--red)}
.board{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:26px 14px 22px;display:flex;justify-content:center;transition:border-color .3s,box-shadow .3s}
.board.lucky{border-color:var(--pencil);box-shadow:0 7px 0 var(--pencil)}
.board.solved{border-color:var(--good);box-shadow:0 7px 0 var(--good)}
.board.shake{animation:shake .35s}
.lucky-tag{position:absolute;top:-14px;left:16px;z-index:4;background:var(--rainbow);color:var(--on-gold);border:2px solid var(--ink);border-radius:999px;padding:0 12px;font-weight:700;font-size:15px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.grid{display:grid;grid-template-columns:repeat(var(--n),var(--c));grid-template-rows:calc(var(--c)*.6) var(--c) var(--c) calc(var(--c)*1.1);position:relative}
.cell{display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:calc(var(--c)*.7);line-height:1;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.mark{color:var(--red);font-size:calc(var(--c)*.4);align-self:end;padding-bottom:2px}
.crossed{color:var(--muted)}
.crossed::after{content:"";position:absolute;left:20%;right:20%;top:50%;height:4px;border-radius:2px;background:var(--red);transform:rotate(-38deg)}
.op{color:var(--blue)}
.rule{grid-column:1/-1;grid-row:3;align-self:end;border-bottom:4px solid var(--ink);border-radius:2px;z-index:1}
.ans{margin:calc(var(--c)*.12) 4px 0;border:3px dashed var(--grid);border-radius:12px;color:var(--good)}
.ans.active{border:3px solid var(--pencil);background:var(--pencil-soft);animation:glow 1.2s ease-in-out infinite}
.ans.done{border-color:transparent}
.hl{grid-row:1/-1;background:var(--tint);border-radius:14px;z-index:0}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.say{display:flex;gap:10px;align-items:flex-start;margin-block:18px}
.say svg{flex:0 0 52px;width:52px;height:52px}
.bubble{flex:1;min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:18px;position:relative}
.bubble::before{content:"";position:absolute;left:-9px;top:16px;width:14px;height:14px;background:inherit;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble.good{background:var(--good-soft)}
.bubble.bad{background:var(--bad-soft)}
.bubble.tip{background:var(--pencil-soft)}
.bubble b{font-family:var(--num);font-size:1.1em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;margin:0 auto}
.key{height:62px;border-radius:16px;background:var(--card);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--num);font-weight:800;font-size:30px}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key.zero{grid-column:span 2}
.subj{display:flex;gap:8px;margin-bottom:14px}
.subj button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--ink);background:var(--card);font-weight:700;font-size:17px}
.subj button.on{background:var(--ink);color:var(--paper)}
.hwtip{grid-column:1/-1;background:var(--tint);border:2px dashed var(--ink);border-radius:16px;padding:10px 14px;font-size:15px}
.cnboard{padding:24px 18px}
.cnq{width:100%;text-align:center;display:grid;gap:10px}
.qtype{font-size:14px;letter-spacing:.1em;color:var(--muted)}
.qtext{font-size:clamp(22px,6vw,30px);line-height:1.7;text-wrap:balance}
.qtext .blank{color:var(--blue);white-space:nowrap}
.qtext .zy{font-size:.7em;letter-spacing:.05em}
.zybig{font-size:clamp(34px,10vw,52px);letter-spacing:.12em;color:var(--blue)}
.hanbig{display:inline-grid;place-items:center;width:1.8em;height:1.8em;font-size:1.3em;border:3px solid var(--red);border-radius:10px;color:var(--red);margin:0 4px;vertical-align:middle}
.qslots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.slot-box{width:clamp(48px,14vw,64px);height:clamp(48px,14vw,64px);display:grid;place-items:center;font-size:clamp(30px,9vw,42px);border:3px solid var(--red);border-radius:6px;background:linear-gradient(var(--grid),var(--grid)) center/100% 1.5px no-repeat,linear-gradient(90deg,var(--grid),var(--grid)) center/1.5px 100% no-repeat,var(--card)}
.slot-box.on{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.cnin{display:block;width:100%;max-width:520px;margin:0 auto;font-family:var(--zh);font-size:clamp(26px,7vw,34px);line-height:1.4;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;resize:none;box-shadow:0 4px 0 var(--ink)}
.cnin:focus{outline:3px solid var(--pencil);outline-offset:2px}
.cnin::placeholder{color:var(--muted);font-size:.7em}
.cnbtns{display:grid;grid-template-columns:2fr 1fr;gap:10px;max-width:520px;margin:14px auto 0}
.cnbtns .big{max-width:none}
#cnNextBtn{margin-top:14px}
.zc{display:inline-flex;align-items:center;white-space:nowrap;vertical-align:baseline}
.zb{display:inline-grid;grid-template-columns:auto auto;align-items:center;justify-items:center;font-size:max(.4em,9px);line-height:1;margin-left:.06em;font-weight:400;letter-spacing:0;text-indent:0;color:inherit;opacity:.9}
.zb i{font-style:normal}
.zb .zn{grid-column:1;grid-row:1;line-height:.6}
.zb .zs{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center}
.zb .zt{grid-column:2;grid-row:2;margin-left:.04em}
.nozy .zb{display:none}
.tgt u{text-decoration:none;color:var(--red);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:420px;margin:6px auto 0}
.opt{min-height:64px;border-radius:16px;border:2px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink);font-size:28px;letter-spacing:.08em}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad,#D8432F);opacity:.7}
.opt.right{background:var(--good-soft);border-color:var(--good);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.key.zero.wide{grid-column:1/-1}
.chal{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px dashed var(--ink);border-radius:16px;padding:12px 16px;margin-bottom:16px;cursor:pointer}
.chal input{width:22px;height:22px;margin-top:3px;accent-color:var(--red);flex:0 0 auto}
.chal.on{border-style:solid;border-color:var(--red);background:var(--bad-soft)}
.key.hint{font-family:var(--zh);font-size:18px;font-weight:700;background:var(--pencil-soft)}
.big{display:block;width:100%;max-width:380px;margin:0 auto;min-height:60px;border-radius:18px;border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink);background:var(--pencil);color:var(--on-gold);font-size:21px;font-weight:700;padding:8px 14px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.big.alt{background:var(--card);color:var(--ink)}
.big.green{background:var(--good);color:#fff}
.big:disabled{opacity:.5;cursor:not-allowed}
.fly{position:absolute;left:50%;top:40%;font-size:40px;pointer-events:none;z-index:5;animation:fly 1.1s ease-out backwards}

/* Done */
.done{text-align:center;padding-block:10px}
.done h2{font-size:clamp(28px,7vw,40px);margin:4px 0}
.badge-wrap{position:relative;height:210px;display:grid;place-items:center;overflow:hidden}
.badge-wrap .rays{opacity:1;animation:spin 14s linear infinite}
.badge{position:relative;z-index:2;width:150px;height:150px;border-radius:50%;background:var(--pencil);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);display:grid;place-items:center;font-family:var(--num);font-weight:800;color:var(--on-gold);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.badge span{font-size:56px;line-height:1;font-variant-numeric:tabular-nums;display:block}
.badge small{font-family:var(--zh);font-size:13px;font-weight:700;display:block}
.badge.bump{animation:bump .18s}
.crown{position:absolute;z-index:3;top:4px;left:50%;width:84px;height:56px;transform:translateX(-50%) rotate(-8deg);animation:drop .7s cubic-bezier(.3,1.5,.5,1) .9s backwards}
.bigstars{font-size:46px;display:flex;justify-content:center;gap:6px;margin-block:8px}
.bigstars .star{animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.bigstars .star:nth-child(1){animation-delay:.3s}.bigstars .star:nth-child(2){animation-delay:.5s}.bigstars .star:nth-child(3){animation-delay:.7s}
.note{display:inline-block;background:var(--good-soft);border:2px solid var(--good);border-radius:999px;padding:4px 14px;margin:4px;font-weight:700}
.bonus{max-width:420px;margin:14px auto 0;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:8px 16px}
.brow{display:flex;justify-content:space-between;gap:12px;padding-block:5px;border-bottom:1px dashed var(--grid)}
.brow b{font-family:var(--num);font-size:19px;color:var(--good);font-variant-numeric:tabular-nums}
.brow.total{border-bottom:none;font-weight:700}
.brow.total b{color:var(--ink);font-size:22px}
.brow.hide{visibility:hidden}
.brow.show{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.bankbox{max-width:420px;margin:12px auto 0;text-align:left;background:var(--pencil-soft);border:2px solid var(--ink);border-radius:18px;padding:12px 16px}
.btns{display:grid;gap:14px;margin-top:22px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

/* Shop */
.wallet{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:14px 18px;margin-bottom:16px}
.wallet .bank-n{font-size:40px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--ink);background:var(--card);font-weight:700;font-size:17px}
.tabs button.on{background:var(--ink);color:var(--paper)}
.blind{text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px 16px}
.bbox{width:170px;height:170px;display:block;margin:0 auto;transform-origin:50% 100%;animation:idlewob 2.6s ease-in-out infinite}
.blind .g-name{font-size:24px}
.blind .meter{max-width:300px;margin:6px auto 2px}
.blind .big{margin-top:10px}
.g-name{font-weight:700;font-size:18px;line-height:1.3}
.g-cost{font-family:var(--num);font-weight:800;font-size:22px}
.odds{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.luck{margin-top:14px;text-align:left;background:var(--paper);border:2px dashed var(--ink);border-radius:14px;padding:10px 14px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;background:var(--card);border:2px dashed var(--grid);border-radius:16px}
.rar{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:0 10px;border:2px solid var(--ink)}
.rar-n{background:var(--tint)}.rar-r{background:var(--good-soft)}.rar-l{background:var(--pencil);color:var(--on-gold)}.rar-h{background:var(--rainbow);color:var(--on-gold)}

/* Figures + shelf */
.fig{width:100px;height:112px;display:block;margin:0 auto}
.sil{filter:brightness(0);opacity:.16}
.shelf-head{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;margin-bottom:14px}

/* Box opening */
.gift-stage{position:relative;height:340px;overflow:hidden}
.rays{position:absolute;left:50%;top:50%;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:repeating-conic-gradient(var(--ray,var(--pencil-soft)) 0 12deg,transparent 12deg 24deg);opacity:0;transition:opacity .6s;z-index:0;pointer-events:none}

.lid{transform-box:fill-box;transform-origin:center;transition:transform .6s cubic-bezier(.3,1.4,.5,1),opacity .6s .2s}
.gift-stage.open .lid{transform:translate(70px,-110px) rotate(40deg);opacity:0}
.prize{position:absolute;left:50%;bottom:92px;z-index:3;width:min(250px,84%);background:var(--paper);border:3px dashed var(--ink);border-radius:16px;padding:10px;transform:translate(-50%,70px) scale(.3);opacity:0;transition:transform .8s cubic-bezier(.3,1.5,.5,1) .3s,opacity .3s .3s}

.gift-stage.open .prize{transform:translate(-50%,0) scale(1);opacity:1}

.tap{color:var(--muted);font-size:15px}

function hasCarry(a,b){const A=digits(a),B=digits(b);let c=0,any=false;for(let i=0;i<Math.max(A.length,B.length);i++){const s=(A[i]||0)+(B[i]||0)+c;c=s>=10?1:0;if(c)any=true}return any}
function hasBorrow(a,b){const A=digits(a),B=digits(b);let br=0,any=false;for(let i=0;i<A.length;i++){const d=A[i]-br-(B[i]||0);if(d<0){any=true;br=1}else br=0}return any}
function genAdd(len,need){for(let t=0;t<500;t++){const a=rnd(10**(len-1),10**len-1),b=len===2?rnd(10,99):rnd(10,999);if(a+b>=10**len)continue;if(hasCarry(a,b)===need)return{op:'+',a,b}}return{op:'+',a:38,b:25}}
function genSub(len,need,zeroBias){for(let t=0;t<500;t++){let a=rnd(10**(len-1),10**len-1);if(zeroBias&&Math.random()<.35)a=rnd(1,9)*100+rnd(0,9);if(a<=20)continue;const b=len===2?rnd(10,a-1):(Math.random()<.7&&a>110?rnd(100,a-1):rnd(10,Math.min(99,a-1)));if(hasBorrow(a,b)===need)return{op:'-',a,b}}return{op:'-',a:52,b:17}}
function genAddUp(){for(let t=0;t<500;t++){const a=rnd(20,99),b=rnd(20,99);if(a+b>=100&&a+b<=198)return{op:'+',a,b}}return{op:'+',a:85,b:47}}
function genSubDown(){for(let t=0;t<500;t++){let a,b;if(Math.random()<.6){a=rnd(100,199);b=rnd(10,99)}else{a=rnd(101,999);b=rnd(Math.max(100,a-99),a-10)}const r=a-b;if(r>=10&&r<=99&&hasBorrow(a,b))return{op:'-',a,b}}return{op:'-',a:112,b:58}}
const LEVELS=[

 {id:'a2',mult:1.5,after:'s1',name:'進位加法',desc:'個位滿 10，進 1 到十位',ex:'38 + 25',gen:()=>genAdd(2,true)},

 {id:'a2h',mult:1.5,after:'s2',name:'進位變百位',desc:'兩位數相加，答案變成三位數',ex:'85 + 47 = 132',gen:genAddUp},
 {id:'s2h',mult:2,after:'a2h',name:'百位不見了',desc:'三位數相減，答案只剩兩位數',ex:'112 − 58 = 54',gen:genSubDown},

 {id:'mx',mult:4,after:'s3',name:'大魔王混合關',desc:'所有題型混在一起，最難也最多星星',ex:'? ± ?',gen:()=>[()=>genAdd(2,true),()=>genSub(2,true),genAddUp,genSubDown,()=>genAdd(3,true),()=>genSub(3,true,true)][rnd(0,5)]()}

let ac=null;
function tone(f,t0,d,type='sine',v=.15){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t0+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+d+.02)}
function sfx(k,x){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 if(k==='good'){tone(660,0,.12);tone(880,.08,.16)}
 else if(k==='bad'){tone(220,0,.22,'triangle',.18)}
 else if(k==='swoop'){tone(500,0,.1,'triangle');tone(700,.07,.1,'triangle');tone(900,.14,.12,'triangle')}
 else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.22))}
 else if(k==='tick'){tone(800+(x||0)*30,0,.06,'square',.06)}
 else if(k==='coin'){tone(988,0,.08,'square',.08);tone(1319,.08,.25,'square',.08)}
 else if(k==='rattle'){for(let i=0;i<(x||9);i++)tone(180+Math.random()*80,i*.1,.06,'triangle',.12)}
 else if(k==='magic'){[784,988,1175,1568,1976].forEach((f,i)=>tone(f,i*.07,.35,'sine',.1))}
 else if(k==='boing'){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(700,t+.15);o.frequency.exponentialRampToValueAtTime(420,t+.3);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.36);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.38)}
 else if(k==='fanfare'){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.18))}
}catch(e){}}

/* ---------- game ---------- */
function startLevel(i){G={L:LEVELS[i],kind:'math',tag:`第 ${i+1} 關・${LEVELS[i].name}`,restart:()=>startLevel(i),next:i+1<LEVELS.length?()=>startLevel(i+1):null,li:i,q:0,base:[],mist:0,bonus:[],lucky:rnd(0,PER-1),luckyHit:false,ch:!!S.challenge};$('lvTitle').textContent=`第 ${i+1} 關・${LEVELS[i].name}${G.ch?'・挑戰模式':''}`;
 $('hintBtn').hidden=G.ch;$('pad').querySelector('.zero').classList.toggle('wide',G.ch);show('play');nextProblem()}
function makeP({op,a,b}){const res=op==='+'?a+b:a-b,A=digits(a),B=digits(b),R=digits(res),n=Math.max(A.length,B.length,R.length)+1,c=[0];
 for(let p=0;p<n;p++)c[p+1]=op==='+'&&((A[p]||0)+(B[p]||0)+c[p])>=10?1:0;
 return{op,a,b,res,A,B,R,n,c,w:A.slice(),entered:[],carry:{},fresh:new Set(),p:0,mistakes:0,colWrong:0,done:false}}
function nextProblem(){
 let q,tries=0;do{q=LEVELS[G.li].gen();tries++}while(G.last&&q.a===G.last.a&&q.b===G.last.b&&tries<20);G.last=q;
 P=makeP(q);P.lucky=G.q===G.lucky;
 $('board').classList.remove('solved');$('board').classList.toggle('lucky',P.lucky);$('luckyTag').hidden=!P.lucky;
 $('pad').hidden=false;$('nextBtn').hidden=true;
 renderDots();activate(0);render();
 if(P.lucky&&(G.ch||!(P.op==='-'&&P.w[0]<(P.B[0]||0)))){say('幸運題出現了！這題答對，多拿 <b>1</b> 顆星！<br>從<b>個位</b>開始吧。','tip');sfx('magic')}
}
function renderDots(){$('dots').innerHTML=Array.from({length:PER},(_,i)=>{const s=G.base[i];return `<div class="dot ${s===3?'ok':s?'ok2':i===G.q?'now':''} ${i===G.lucky?'luck':''}">${s?'✓':i===G.lucky?'+1':i+1}</div>`}).join('')}
function say(html,kind=''){const b=$('bubble');b.className='bubble '+kind;b.innerHTML=html}
function activate(p,keep){P.p=p;P.colWrong=0;
 if(P.op==='-'){const bv=P.B[p]||0;if(P.w[p]<bv){borrow(p,bv);return}}
 if(!keep)say(p===0?`從<b>${PLACE[p]}</b>開始，由右往左算！`:`輪到<b>${PLACE[p]}</b>了！`);
}
function borrow(p,bv){let j=p+1;while(P.w[j]===0)j++;
 const before=P.w[p],oldJ=P.w[j];P.w[j]-=1;P.fresh.add(j);
 for(let k=p+1;k<j;k++){P.w[k]=9;P.fresh.add(k)}P.w[p]+=10;P.fresh.add(p);
 if(G.ch){if(!(P.lucky&&p===0))say(p===0?`從<b>${PLACE[p]}</b>開始，由右往左算！`:`輪到<b>${PLACE[p]}</b>了！`);return}
 sfx('swoop');
 const pre=P.lucky&&p===0?'幸運題！答對多 +1 ★。<br>':'';
 if(j===p+1)say(`${pre}${PLACE[p]} <b>${before}</b> 不夠減 <b>${bv}</b>，向${PLACE[j]}借 1！<br>${PLACE[j]} ${oldJ} 變成 <b>${oldJ-1}</b>，${PLACE[p]}變成 <b>${before+10}</b>。`,'tip');
 else say(`${pre}${PLACE[p]} <b>${before}</b> 不夠減 <b>${bv}</b>，可是${PLACE[p+1]}是 0 借不到，要先跟${PLACE[j]}借！<br>${PLACE[j]} ${oldJ} 變成 <b>${oldJ-1}</b>，${PLACE[p+1]}變成 <b>9</b>，${PLACE[p]}變成 <b>${before+10}</b>。`,'tip');
}
function expr(p){if(P.op==='+'){const parts=[];if(p<P.A.length)parts.push(P.A[p]);if(p<P.B.length)parts.push(P.B[p]);if(P.c[p])parts.push('進位 1');const s=(P.A[p]||0)+(P.B[p]||0)+P.c[p];return{t:parts.join(' + '),s}}
 return{t:`${P.w[p]} − ${P.B[p]||0}`,s:P.w[p]-(P.B[p]||0)}}
function hint(p,reveal){const e=expr(p);
 if(!reveal)return `${PLACE[p]}：<b>${e.t} = ?</b>`;
 return `${PLACE[p]}：<b>${e.t} = ${e.s}</b>，${e.s>=10&&P.op==='+'?`寫 <b>${e.s%10}</b>，進 1`:`寫 <b>${e.s}</b>`}`}
function press(d){if(!P||P.done)return;const p=P.p;
 if(d===P.R[p]){P.entered[p]=d;P.fresh.add('a'+p);sfx('good');
  let msg='';if(!G.ch&&P.op==='+'&&P.c[p+1]&&p+1<P.R.length){P.carry[p+1]=true;P.fresh.add(p+1);msg=`${expr(p).s} 滿 10 了！寫 <b>${d}</b>，把 <b>1</b> 進到${PLACE[p+1]}上面。`}
  if(p+1<P.R.length){if(msg)say(msg,'tip');activate(p+1,!!msg);render()}else{render();finish()}

const CN_N=6;
const CN_LV=()=>{const ls=CN_BANK.map(b=>({id:'cn:'+b.id,mult:1.5,name:b.title,lessons:[b],bank:b}));
 ls.push({id:'cn:boss',mult:3,name:'國語大魔王',lessons:CN_BANK,boss:true});return ls};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
/* 選讀音的錯誤選項：換聲調、換相近的聲母或韻母 */
const ZY_SIM=[['ㄓ','ㄗ'],['ㄔ','ㄘ'],['ㄕ','ㄙ'],['ㄋ','ㄌ'],['ㄈ','ㄏ'],['ㄅ','ㄆ'],['ㄉ','ㄊ'],['ㄍ','ㄎ'],['ㄐ','ㄑ'],['ㄢ','ㄤ'],['ㄣ','ㄥ'],['ㄛ','ㄡ'],['ㄟ','ㄞ']];
function zyWrong(r){const base=r.replace(/[ˊˇˋ˙]/g,''),tones=['','ˊ','ˇ','ˋ'],cur=(r.match(/[ˊˇˋ]/)||[''])[0],out=new Set();
 for(const t of shuffle(tones))if(t!==cur&&out.size<2)out.add(base+t);
 for(const [a,b] of shuffle(ZY_SIM)){if(out.size>=4)break;if(base.includes(a))out.add(base.replace(a,b)+cur);else if(base.includes(b))out.add(base.replace(b,a)+cur)}
 for(const t of tones){if(out.size>=4)break;const x=base.replace(/ㄧ|ㄨ/,'')+t;if(x&&x!==r)out.add(x)}
 out.delete(r);return shuffle([...out]).slice(0,3)}
function cnMake(lessons){const pick=arr=>arr&&arr.length?arr[rnd(0,arr.length-1)]:null;
 const mk={fill:b=>{const w=pick(b.words);return w&&{t:'fill',ans:[w.w],zy:zyWord(w.w),text:w.ex}},
  blank:b=>{const w=pick(b.words);return w&&{t:'blank',ans:[w.w,...(w.alt||[])],zy:zyWord(w.w),text:w.ex}},
  zy:b=>{const w=pick(b.words);return w&&{t:'zy',ans:[w.w],zy:zyWord(w.w)}},
  read:b=>{const r=pick(b.read);return r&&{t:'read',c:r.c,w:r.w,ans:[r.zy],opts:shuffle([r.zy,...zyWrong(r.zy)])}},
  word:b=>{const c=pick(b.chars);return c&&{t:'word',char:c.c,eg:c.eg||[]}},
  sent:b=>{const x=pick(b.sents);return x&&{t:'sent',w:x.w,min:x.min||6,eg:[x.ex]}}};
 const order=['fill','blank','zy','read','word','sent'],out=[],seen=new Set();
 for(const t of order){let q=null;for(let k=0;k<14&&!q;k++){const b=pick(lessons);const c=mk[t](b)||(k>8?mk.fill(b):null);if(!c)continue;
   const key=(c.t==='sent'||c.t==='word'||c.t==='read'?c.t:'')+(c.c||c.char||c.w||c.ans[0]);if(!seen.has(key)||k>=12){seen.add(key);q=c}}
  if(q)out.push(q)}
 while(out.length<CN_N)out.push(mk.fill(pick(lessons)));return out}
const cnNorm=s=>String(s||'').replace(/[\s　]/g,'').replace(/[.。,，!！?？、;；:：「」『』（）()~～…]/g,'');
const isHan=s=>/^[㐀-鿿豈-﫿]+$/.test(s);
function cnCheck(q,raw){const v=cnNorm(raw);if(!v)return{ok:false,msg:'還沒有寫答案喔！'};
 if(q.t==='fill'||q.t==='zy'||q.t==='blank')return q.ans.some(a=>cnNorm(a)===v)?{ok:true}:{ok:false,msg:'再想想！'};
 if(q.t==='word'){if(!isHan(v))return{ok:false,msg:'只要寫國字就好喔！'};if(!v.includes(q.char))return{ok:false,msg:`語詞裡要有「${q.char}」這個字喔！`};
  if(v.length<2)return{ok:false,msg:`「${q.char}」再加一個字，變成語詞！`};if(v.length>4)return{ok:false,msg:'語詞寫 2 到 4 個字就好！'};return{ok:true}}
 if(q.t==='sent'){const han=(v.match(/[㐀-鿿豈-﫿]/g)||[]).length;
  if(!v.includes(q.w))return{ok:false,msg:`句子裡要用到「${q.w}」喔！`};if(han<q.min)return{ok:false,msg:`句子再長一點，至少要 ${q.min} 個字（現在 ${han} 個）。`};
  if(v===q.w)return{ok:false,msg:'把語詞放進一句完整的話裡！'};return{ok:true}}
 return{ok:false,msg:'再想想！'}}

let C=null,CQ=null;
function startCn(i){const all=CN_LV(),L=all[i];
 G={li:i,L,kind:'cn',tag:`國語・${L.name}`,q:0,base:[],mist:0,bonus:[],lucky:rnd(0,CN_N-1),ch:!!S.challenge,
  restart:()=>startCn(i),next:i+1<all.length?()=>startCn(i+1):null};
 C={qs:cnMake(L.lessons)};
 $('cnTitle').textContent=`國語・${L.name}${G.ch?'・挑戰模式':''}`;
 show('cnplay');cnNext()}
function cnDots(){$('cnDots').innerHTML=Array.from({length:CN_N},(_,i)=>{const s=G.base[i];return `<div class="dot ${s===3?'ok':s?'ok2':i===G.q?'now':''} ${i===G.lucky?'luck':''}">${s?'✓':i===G.lucky?'+1':i+1}</div>`}).join('')}

function cnNext(){CQ=Object.assign({mistakes:0,done:false},C.qs[G.q]);CQ.lucky=G.q===G.lucky;const isRead=CQ.t==='read';

 $('qType').textContent=CN_TYPE[CQ.t];const inp=$('cnInput');inp.value='';inp.disabled=false;inp.rows=CQ.t==='sent'?3:1;inp.hidden=isRead;
 inp.placeholder=CQ.t==='sent'?'在這裡寫一句話':'在這裡寫答案';
 let h='';
 if(CQ.t==='fill')h=CQ.text.replace('＿＿',`<span class="blank">（<span class="zy">${CQ.zy}</span>）</span>`);
 if(CQ.t==='blank')h=CQ.text.replace('＿＿','<span class="blank">（　　）</span>');
 if(CQ.t==='zy')h=`<span class="zybig">${CQ.zy}</span>`;
 if(CQ.t==='read')h=`「<span class="noz tgt">${CQ.w.replace(CQ.c,`<u>${CQ.c}</u>`)}</span>」的「<span class="noz tgt"><u>${CQ.c}</u></span>」怎麼念？`;
 if(CQ.t==='word')h=`用「<span class="hanbig">${CQ.char}</span>」寫一個語詞`;
 if(CQ.t==='sent')h=`用「<b>${CQ.w}</b>」寫一個句子<div class="tag">至少 ${CQ.min} 個字</div>`;
 $('qText').innerHTML=h;
 if(isRead){$('qSlots').innerHTML=`<div class="opts">${CQ.opts.map((o,i)=>`<button class="opt" type="button" data-o="${i}">${o}</button>`).join('')}</div>`;
  $('qSlots').querySelectorAll('.opt').forEach(b=>b.onclick=()=>cnPick(b))}else cnSlots();
 const intro={fill:'看注音，想一想括號裡要寫什麼字。',blank:'沒有注音喔！讀讀看句子，想一想括號裡可以填什麼語詞。',zy:'把注音寫成國字。',read:'這是認讀字，只要會念就好。點一點正確的注音。',word:`「${CQ.char}」可以組成哪些語詞呢？`,sent:'想一想什麼時候會用到這個語詞，寫成一句話。'}[CQ.t];
 cnSay((CQ.lucky?'幸運題！答對多拿 <b>1</b> 顆星。<br>':'')+intro,CQ.lucky?'tip':'');if(CQ.lucky)sfx('magic');
 $('cnOk').hidden=isRead;$('cnHint').hidden=G.ch||isRead;$('cnNextBtn').hidden=true;cnDots();
 if(!isRead)setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},50)}
function cnPick(btn){if(!CQ||CQ.done)return;const o=CQ.opts[+btn.dataset.o];
 if(o===CQ.ans[0]){btn.classList.add('right');cnFinish(false);return}
 btn.classList.add('wrong');btn.disabled=true;CQ.mistakes++;sfx('bad');
 if(CQ.mistakes>=2){$('qSlots').querySelectorAll('.opt').forEach(b=>{if(CQ.opts[+b.dataset.o]===CQ.ans[0])b.classList.add('right')});cnFinish(true);return}
 cnSay(G.ch?'再想想！':'再想想！念念看整個語詞。','bad')}
function cnSlots(){const v=cnNorm($('cnInput').value);let n=CQ.t==='fill'||CQ.t==='zy'||CQ.t==='blank'?CQ.ans[0].length:CQ.t==='word'?Math.max(2,v.length):0;
 if(!n){$('qSlots').innerHTML='';return}
 $('qSlots').innerHTML=Array.from({length:n},(_,i)=>`<span class="slot-box ${v[i]?'on':''}">${v[i]||''}</span>`).join('')}
function cnSay(h,k=''){const b=$('cnBubble');b.className='bubble '+k;b.innerHTML=h}
function cnSubmit(){if(!CQ||CQ.done||CQ.t==='read')return;const r=cnCheck(CQ,$('cnInput').value);
 if(!cnNorm($('cnInput').value)){cnSay(r.msg,'tip');return}
 if(r.ok){cnFinish(false);return}
 CQ.mistakes++;sfx('bad');const b=$('cnBoard');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
 if(CQ.mistakes>=3){cnFinish(true);return}
 if(G.ch||CQ.t==='word'||CQ.t==='sent'){cnSay(r.msg,'bad');return}
 if(CQ.t==='blank')cnSay(CQ.mistakes===1?'再想想！讀一次整個句子。':`再想想！注音是「<b>${CQ.zy}</b>」。`,'bad');
 else cnSay(CQ.mistakes===1?'再想想！可以按「提示」看看。':`再想想！第一個字是「<b>${CQ.ans[0][0]}</b>」。`,'bad')}
function cnHint(){if(!CQ||CQ.done)return;

 G.base.push(st);G.mist+=CQ.mistakes;$('cnInput').disabled=true;

 if(gaveUp){msg=CQ.t==='read'?`沒關係！「${CQ.c}」念作「<b class="noz">${ans}</b>」。`:CQ.t==='fill'||CQ.t==='zy'||CQ.t==='blank'?`沒關係！答案是「<b>${ans}</b>」，下次一定記得。`:`沒關係，看看範例：${(CQ.eg||[]).slice(0,3).join('、')}`;sfx('swoop')}
 else{msg=(CQ.mistakes===0?PRAISE[rnd(0,PRAISE.length-1)]:'答對了，做得好！');sfx('win');$('cnBoard').classList.add('solved');

 a.forEach((c,i)=>{if(c!=='一'&&c!=='不')return;if(ZYL[(a[i-1]||'')+c]||ZYR[c+(a[i+1]||'')])return;
  const nx=a[i+1],pv=a[i-1];let nt=nx&&HANC.test(nx)?zyTone(out[i+1]):0;if(nt===5&&nx==='個')nt=4;

   <div class="g-name">甜甜雲朵鎮盲盒</div><div class="g-cost">${starSvg()} ${price}</div>
   ${ok?`<button class="big" type="button" id="buyBox">抽一個盲盒！</button>`:`<div class="meter"><i style="width:${Math.min(100,b/price*100)}%"></i></div><div class="tag">還差 ${price-b} 顆星，去練習吧！</div>`}
   <p class="tag" style="margin:12px 0 0">抽到重複的公仔會升級換裝，最高 Lv3！<br>還沒有的公仔比較容易抽到，滿級的公仔不會再出現。</p>
   <div class="odds">${['n','r','l','h'].map(r=>cnt(r)?`<span class="rar rar-${r}">${RAR[r].name} 可抽 ${cnt(r)} 個</span>`:'').join('')}</div>
   ${hidLeft?`<div class="luck"><b>幸運值</b>　<span class="tag">下一抽隱藏版機率 ${ch}%</span><div class="meter rainbow"><i style="width:${Math.min(100,S.pity/9*100)}%"></i></div><div class="tag">沒抽到隱藏版，幸運值就會增加；集滿一定抽到！</div></div>`:''}</div>`;
  if(ok)$('buyBox').onclick=confirmBuy;
 }else{
  const own=S.owned.length,lv=shelfLv(),all=!left.length;
  const slot=f=>{const has=owned(f.id);return `<button class="slot ${has?'':'empty-slot'} ${freshFig===f.id?'new':''}" type="button" ${has?`data-see="${f.id}"`:'disabled'} aria-label="${has?f.name:'還沒收集'}">${plush(f,has?'fig':'fig sil')}<span class="s-name">${has?f.name:'？？？'}</span>${has?`<span class="lvchip l${lvOf(f.id)}">Lv${lvOf(f.id)}</span>`:''}</button>`};
  const nextLv=[7,14,REG.length].find(n=>regOwned()<n);
  $('shopBody').innerHTML=`<div class="shelf-head">${all?'<b>全部公仔都升到 Lv3！你是公仔大師！</b>':own?`已收集 <b>${own}</b> / ${FIGS.length} 個公仔・總等級 <b>${FIGS.reduce((t,f)=>t+lvOf(f.id),0)}</b> / ${FIGS.length*3}<br><span class="tag">點公仔看看它會做什麼、下一級會穿什麼</span>`:'公仔櫃還是空的。完成關卡存星星，就能抽第一個盲盒！'}
    <div class="meter"><i style="width:${own/FIGS.length*100}%"></i></div>${nextLv?`<div class="tag">收集 ${nextLv} 個一般公仔，公仔櫃就會升級</div>`:''}</div>
   ${['n','r','l'].map(r=>{const fs=REG.filter(f=>f.r===r);return `<div class="shelf l${lv}" style="margin-top:14px"><div class="shelf-name">${rarChip(r)} <span class="tag">${SHELF[lv]}・${fs.filter(f=>owned(f.id)).length}/${fs.length}</span></div>${fs.map(slot).join('')}</div>`}).join('')}
   <div class="shelf hid"><div class="shelf-name"><span class="rar rar-h">隱藏版</span> <span class="tag">${HID.filter(f=>owned(f.id)).length}/${HID.length}</span></div>${HID.map(slot).join('')}</div>`;
  freshFig=null;
  $('shopBody').querySelectorAll('[data-see]').forEach(el=>el.onclick=()=>showFig(el.dataset.see));
 }
}

/* ---------- modal ---------- */
function openModal(html,bind){$('sheet').innerHTML=html;$('modal').hidden=false;bind&&bind();const f=$('sheet').querySelector('button');f&&f.focus()}
function closeModal(){$('modal').hidden=true;$('sheet').innerHTML=''}
$('modal').addEventListener('click',e=>{if(e.target===$('modal')&&!gifting)closeModal()});

function pick(list,wf){const tot=list.reduce((s,f)=>s+wf(f),0);let x=Math.random()*tot;for(const f of list){x-=wf(f);if(x<=0)return f}return list[list.length-1]}
function draw(){const regs=REG.filter(f=>lvOf(f.id)<3),hids=HID.filter(f=>lvOf(f.id)<3),nw=f=>owned(f.id)?1:2;
 if(hids.length&&Math.random()<hidChance()){S.pity=0;return pick(hids,nw)}
 if(hids.length)S.pity++;
 return pick(regs,f=>RAR[f.r].w*nw(f))}
function confirmBuy(){const b=bal(),c=boxPrice();
 openModal(`${boxSvg('bbox')}<h3>要抽一個盲盒嗎？</h3><p>用 <b>${c}</b> 顆星，抽完會剩下 <b>${b-c}</b> 顆星。</p>
  <div class="btns"><button class="big" type="button" id="yesBuy">好，抽！</button><button class="big alt" type="button" id="noBuy">再想想</button></div>`,()=>{
  $('noBuy').onclick=closeModal;
  $('yesBuy').onclick=()=>{if(bal()<c||!leftFigs().length){closeModal();return}
   const lvBefore=shelfLv();S.spent+=c;const f=draw(),L=lvOf(f.id)+1;if(L===1)S.owned.push(f.id);S.lv[f.id]=L;S.boxes++;save();syncBal();openBox(f,lvBefore,L)}});
}
function openBox(f,lvBefore,L){gifting=true;const shakes={n:2,r:3,l:4,h:6}[f.r];
 const lvAfter=shelfLv();
 openModal(`<h3 id="gTitle">盲盒裡面是……</h3><div class="tap" id="gTap">盒子在動，是誰呢？</div>
  <div class="gift-stage" id="stage"><div class="rays ${f.r==='h'?'rainbow':''}" style="--ray:${f.r==='l'?'var(--pencil-soft)':f.r==='r'?'var(--good-soft)':'var(--tint)'}"></div>
   ${boxSvg('box')}
   <div class="prize ${f.r==='h'?'h':''}">${plush(f,'fig',L)}<div>${rarChip(f.r)} <span class="lvchip l${L}">Lv${L}</span></div><div class="g-name">${f.name}</div></div></div>
  ${lvAfter>lvBefore?`<p class="note" id="lvUp" hidden>公仔櫃升級成「${SHELF[lvAfter]}」了！</p>`:''}
  <div class="btns"><button class="big" type="button" id="takeIt" hidden>放進公仔櫃</button></div>`);
 const st=$('stage'),box=st.querySelector('.box');
 const done=()=>{st.classList.remove('flash');st.classList.add('open');
  if(L===1){$('gTitle').textContent=f.r==='h'?'哇！！是隱藏版！':f.r==='l'?'傳說公仔！好幸運！':f.r==='r'?'稀有公仔！':'抽到了新公仔！';$('gTap').textContent=`${f.name}：${f.like}`}
  else{$('gTitle').textContent=L===3?'升到 Lv3！閃亮完全體！':'重複了！升到 Lv2！';$('gTap').textContent=L===3?`${f.name}戴上了${ACCN[OUT[f.id][1]]}，全身閃閃發光！`:`${f.name}戴上了${ACCN[OUT[f.id][0]]}！再抽到一次就是 Lv3`}
  if(f.r==='h'){sfx('magic');setTimeout(()=>{sfx('fanfare');confetti();confetti()},300)}else{sfx('fanfare');confetti()}
  setTimeout(()=>{gifting=false;if(!$('takeIt'))return;$('takeIt').hidden=false;if($('lvUp'))$('lvUp').hidden=false;$('takeIt').focus()},reduced()?0:1100)};
 $('takeIt').onclick=()=>{closeModal();freshFig=f.id;shopTab='shelf';renderShop()};
 if(reduced()){done();return}
 setTimeout(()=>{box.style.animationIterationCount=shakes;st.classList.add('shake');sfx('rattle',shakes*3)},250);
 const shakeEnd=250+shakes*320;
 if(f.r==='h'){setTimeout(()=>{st.classList.add('flash');$('gTap').textContent='咦？盒子在發光！';sfx('magic')},shakeEnd);setTimeout(done,shakeEnd+900)}
 else setTimeout(done,shakeEnd+150);
}
function showFig(id){const f=FIGS.find(x=>x.id===id);if(!f)return;const L=lvOf(f.id)||1;
 openModal(`${rarChip(f.r)} <span class="lvchip l${L}">Lv${L}</span><div class="fig-big" id="figBig">${plush(f,'fig',L)}</div><h3>${f.name}</h3><p id="figSay">${f.like}</p>
  <div class="lvrow">${[1,2,3].map(l=>`<div class="lvbox ${l<=L?'':'locked'}">${plush(f,l<=L?'fig':'fig sil',l)}<div class="tag">Lv${l}${l>1?'・'+ACCN[OUT[f.id][l-2]]:'・原本的樣子'}</div></div>`).join('')}</div>
  <p class="tag">${L<3?`再抽到一次${f.name}，就能升到 Lv${L+1}，戴上${ACCN[OUT[f.id][L-1]]}！`:'已經是最高等級 Lv3！'}</p>
  <div class="btns"><button class="big" type="button" id="hug">${f.btn}</button><button class="big alt" type="button" id="figClose">關閉</button></div>`,()=>{
  $('figClose').onclick=closeModal;
  $('hug').onclick=()=>{const w=$('figBig');[...w.classList].filter(c=>c.startsWith('a-')).forEach(c=>w.classList.remove(c));void w.offsetWidth;w.classList.add('a-'+f.act);
   figSound(f.snd);spawnParts(w,f.pt);const say=$('figSay');say.innerHTML=`<b style="font-family:var(--zh)">「${f.say}」</b>`;say.classList.remove('pop');void say.offsetWidth;say.classList.add('pop')}});
}

/* ---------- confetti ---------- */
function confetti(){if(reduced())return;
 const cv=$('confetti'),x=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight,cs=getComputedStyle(document.documentElement);
 const cols=['--pencil','--red','--good','--blue'].map(v=>cs.getPropertyValue(v).trim()).concat(['#F7A8C8','#B9A6F2']);
 const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*80,y:H*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[rnd(0,cols.length-1)]}));
 let f=0;(function tick(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
  if(++f<180)requestAnimationFrame(tick);else x.clearRect(0,0,W,H)})();
}

syncSound();renderHome();
})();
</script>
